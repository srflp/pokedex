name: typecheck

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  tsgo:
    name: tsgo --noEmit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup
        uses: ./.github/actions/setup

      - name: Type check
        run: pnpm typecheck
