name: e2e

on:
  pull_request:
    branches: [main]
  schedule:
    # Friday 22:00 UTC — late Friday across US/EU timezones.
    - cron: "0 22 * * 5"
  workflow_dispatch:

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec playwright install --with-deps chromium

      # PR runs: wait for Netlify deploy preview and grab its URL.
      - name: Wait for Netlify deploy preview
        if: github.event_name == 'pull_request'
        id: netlify
        uses: JakePartusch/wait-for-netlify-action@v1.4
        with:
          site_name: alledex
          max_timeout: 300

      - name: Resolve base URL
        id: base-url
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "url=${{ steps.netlify.outputs.url }}" >> "$GITHUB_OUTPUT"
          else
            echo "url=https://alledex.netlify.app" >> "$GITHUB_OUTPUT"
          fi

      - run: pnpm exec playwright test
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.base-url.outputs.url }}

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
