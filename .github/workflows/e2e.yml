name: e2e

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Friday 22:00 UTC — late Friday across US/EU timezones.
    - cron: "0 22 * * 5"
  workflow_dispatch:

jobs:
  playwright:
    name: chromium
    runs-on: ubuntu-latest
    # Image tag must match @playwright/test version in package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup
        uses: ./.github/actions/setup

      - name: Wait for Netlify deploy
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        id: netlify
        uses: autotelic/action-wait-for-status-check@v1.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          statusName: ${{ github.event_name == 'pull_request' && 'netlify/alledex/deploy-preview' || 'netlify/alledex/deploy' }}
          timeoutSeconds: 600

      - name: Fail if Netlify deploy failed
        if: steps.netlify.outputs.state == 'failure'
        run: exit 1

      - name: Run Playwright
        run: pnpm exec playwright test
        env:
          PLAYWRIGHT_BASE_URL: ${{ github.event_name == 'pull_request' && format('https://deploy-preview-{0}--alledex.netlify.app', github.event.pull_request.number) || 'https://alledex.netlify.app' }}

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
