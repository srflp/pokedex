name: e2e

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Friday 22:00 UTC — late Friday across US/EU timezones.
    - cron: "0 22 * * 5"
  workflow_dispatch:

jobs:
  playwright:
    name: chromium
    runs-on: ubuntu-latest
    # Image tag must match @playwright/test version in package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble@sha256:9bd26ad900bb5e0f4dee75839e957a89ae89c2b7ab1e76050e559790e946b948
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup
        uses: ./.github/actions/setup

      - name: Wait for Netlify deploy
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        id: netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: 81b36aa8-9ffb-4018-a185-c02d2c232861
          COMMIT_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          CONTEXT: ${{ github.event_name == 'pull_request' && 'deploy-preview' || 'production' }}
        run: node .github/scripts/wait-for-netlify-deploy.mjs

      - name: Run Playwright
        run: pnpm exec playwright test
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.netlify.outputs.url || 'https://alledex.netlify.app' }}

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
